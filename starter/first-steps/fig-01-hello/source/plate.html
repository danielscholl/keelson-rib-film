<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#1e3a5f; --accent:#b5803a; --muted:#51607a; --done:#2f8f5b; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    background:
      linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px) 0 0/72px 72px,
      linear-gradient(180deg, #f3f5f8 0%, #e6eaf0 100%);
  }
  #header { position:absolute; left:128px; right:128px; top:34px; height:44px; display:flex; justify-content:space-between;
    align-items:center; border-bottom:1.5px solid rgba(30,58,95,.45); font-size:18px;
    letter-spacing:.2em; }
  #boardName { position:relative; width:520px; height:24px; color:var(--muted); }
  #boardName span { position:absolute; right:0; top:0; opacity:0; white-space:nowrap; }
  .board { position:absolute; inset:0; opacity:0; }
  .title { position:absolute; left:0; right:0; top:300px; text-align:center; font-size:96px; font-weight:300; letter-spacing:.12em; opacity:0; }
  .chips { position:absolute; left:0; right:0; top:560px; display:flex; justify-content:center; gap:56px; }
  .chip { width:340px; padding:28px 0; text-align:center; border:2px solid var(--ink); border-radius:16px; background:#fff;
    font-size:30px; font-weight:500; letter-spacing:.18em; opacity:0; }
  .heading { position:absolute; left:0; right:0; top:250px; text-align:center; font-size:64px; font-weight:300; letter-spacing:.12em; opacity:0; }
  .row { position:absolute; left:160px; right:160px; top:430px; display:flex; justify-content:space-between; }
  .stage { width:230px; padding:34px 0; text-align:center; border:2px solid rgba(30,58,95,.35); border-radius:16px;
    background:#fff; font-size:28px; font-weight:500; letter-spacing:.14em; color:var(--muted); opacity:0; }
  .loop { position:absolute; left:0; right:0; top:680px; text-align:center; font-size:44px; font-weight:300; letter-spacing:.1em; color:var(--accent); opacity:0; }
</style>
</head>
<body>
<div id="header">
  <span><b>FIRST STEPS</b> &nbsp;·&nbsp; FIG. 01 &nbsp;·&nbsp; HELLO, FILM</span>
  <div id="boardName"><span id="bn-idea">WHERE A FILM COMES FROM</span><span id="bn-stages">THE STAGES</span></div>
</div>

<div class="board" id="idea">
  <div class="title" id="i-title">YOUR FIRST FILM</div>
  <div class="chips">
    <div class="chip" id="i-manifest">MANIFEST</div>
    <div class="chip" id="i-voice">VOICE</div>
    <div class="chip" id="i-board">BOARD</div>
  </div>
</div>

<div class="board" id="stages">
  <div class="heading" id="s-heading">ONE LINE, SIX STAGES</div>
  <div class="row">
    <div class="stage" id="s-script">SCRIPT</div>
    <div class="stage" id="s-voice">VOICE</div>
    <div class="stage" id="s-motion">MOTION</div>
    <div class="stage" id="s-cut">CUT</div>
    <div class="stage" id="s-check">CHECK</div>
    <div class="stage" id="s-publish">PUBLISH</div>
  </div>
  <div class="loop" id="s-loop">CHANGE A LINE &nbsp;→&nbsp; CUT AGAIN</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

// The renderer calls setup with each board's span and each line's word times, and seeks the paused timeline.
window.setup = (T, words) => {
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const lineAt = {};
  for (const b of Object.values(T)) for (const [id, l] of Object.entries(b.lines)) lineAt[id] = l.n;
  const W = (id, phrase) => {
    const ws = words[id], want = phrase.split(/\s+/).map(norm);
    for (let i = 0; i < ws.length; i++) {
      if (want.every((w, j) => ws[i + j] && norm(ws[i + j][0]) === w)) return lineAt[id] + ws[i][1];
    }
    throw new Error(`phrase "${phrase}" not in ${id}`);
  };
  const show = (e, at, d = 0.4) => tl.to(e, { opacity: 1, duration: d }, at);
  for (const id of Object.keys(T)) {
    tl.set($(id), { opacity: 1 }, T[id].s); tl.set($(id), { opacity: 0 }, T[id].e);
    tl.set($(`bn-${id}`), { opacity: 1 }, T[id].s); tl.set($(`bn-${id}`), { opacity: 0 }, T[id].e);
  }

  show($("i-title"), T.idea.s + 0.2, 0.6);
  show($("i-manifest"), W("n1", "manifest") - 0.2);
  show($("i-voice"), W("n1", "voice") - 0.2);
  show($("i-board"), W("n1", "board") - 0.2);

  show($("s-heading"), T.stages.s + 0.2, 0.6);
  for (const s of ["script", "voice", "motion", "cut", "check", "publish"]) {
    show($(`s-${s}`), W("n2", s) - 0.15, 0.3);
    tl.to($(`s-${s}`), { color: "#1e3a5f", borderColor: "#1e3a5f", duration: 0.3 }, W("n2", s) - 0.15);
  }
  const again = W("n3", "cut again");
  show($("s-loop"), W("n3", "Change a line") - 0.1);
  tl.to([$("s-cut"), $("s-check")], { borderColor: "#2f8f5b", color: "#2f8f5b", duration: 0.3 }, again);
  return tl.duration();
};
</script>
</body>
</html>
